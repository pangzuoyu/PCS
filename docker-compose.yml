services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pcs
      POSTGRES_PASSWORD: pcs_dev
      POSTGRES_DB: pcs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcs"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  openldap:
    # 测试用 AD/LDAP 容器。生产环境替换为客户域 LDAP_URL（env 注入）。
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: PCS Test
      LDAP_DOMAIN: test.local
      LDAP_ADMIN_PASSWORD: admin
    ports: ["389:389"]
    volumes:
      - ldap-seed:/container/service/slapd/assets/test
  openldap-seed:
    # 用一次性容器把 seed.ldif 灌入 openldap，完成后退出
    image: osixia/openldap:1.5.0
    depends_on: [openldap]
    command: >
      sh -c "sleep 5 &&
             ldapadd -x -H ldap://openldap:389 -D 'cn=admin,dc=test,dc=local' -w admin
             -f /test/seed.ldif || true"
    volumes:
      - ./infra/ldap:/test:ro
    restart: "no"
volumes:
  pgdata:
  ldap-seed:
