services:
  postgres:
    image: postgres:18-alpine
    environment:
      # 这三个改成插值，worker 的 DATABASE_URL 才能复用同一组变量 ——
      # 否则密码会在文件里出现两处，改一处漏一处，表现为「连不上库」。
      # 默认值仍是开发用的弱口令；要换成真凭据就 export 这三个变量。
      POSTGRES_USER: ${POSTGRES_USER:-pcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pcs}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcs"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-pgtest:
    # ⚠️ **独立实例**（不是复用开发库那个 postgres）：PG 车道跑的是
    # 迁移 / 降级环 / 并发用例 ⇒ 绝不能污染开发数据（CLAUDE.md「漂移盲区」）。
    # 独立 database（pcs_pgtest）防「开发时 alembic upgrade head 误把
    # 测试数据升了」。裁决 4 修正 2 明确要求独立实例 + 独立 database。
    # ⚠️ **"test" 也在列表里** —— `seed` 依赖它，而 compose 的 `depends_on`
    #    **不会**隐式启动不在启用 profile 内的服务 ⇒ 只有 postgres-pgtest 时，
    #    `--profile test` 起不出 seed（报「service is not enabled」）。
    profiles: ["pg", "test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcs_dev}
      POSTGRES_DB: pcs_pgtest
    ports: ["5433:5432"]
    # ⚠️ **必须挂在 `/var/lib/postgresql`**（不是 `/var/lib/postgresql/data`）：
    #    PG 18 的官方镜像把 PGDATA 设为 `/var/lib/postgresql/18/docker`，
    #    且启动时**拒绝**发现 `/var/lib/postgresql/data` 里有数据 ⇒ 挂在
    #    data 上会直接 Exited(1)（实测 2026-11-02）。
    #    见 https://github.com/docker-library/postgres/pull/1259
    volumes: [pgtestdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcs -d pcs_pgtest"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    # 队列是**持久**状态：没挂卷的话 `docker compose down` 就把待执行的
    # job 一起清掉，而 API 已经回过 202 —— 那些任务就此凭空消失且无人知晓。
    volumes: [redisdata:/data]
    # worker 用 `condition: service_healthy` 等它。早启动不会失败
    # （ARQ 会重连），但会刷一串连接错误日志，且首个 job 可能因此丢失。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    # ARQ worker：跑报表异步生成（`generate_report_task` /
    # `execute_definition_task`）与三个 cron。
    #
    # ⚠️ **没有 Dockerfile**，直接用 uv 官方镜像挂源码跑 —— 与 README 里
    # 「后端本地 `uv run uvicorn`」的开发方式一致，不额外引入构建产物。
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: ["uv", "run", "--frozen", "arq", "app.workers.worker.WorkerSettings"]
    # ⚠️ venv 必须放到挂载点**之外**（/opt/venv）。默认会写进 /app/.venv，
    # 而 /app 是宿主机的 pcs-backend —— 容器里的 uv sync 会用 root 属主、
    # 不同平台重建它，开发者本地的 `uv run` 随即坏掉。
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uvcache
      # 源码是只读挂载，仍显式禁字节码：省一次无谓的写失败
      PYTHONDONTWRITEBYTECODE: "1"
      # 容器网络里服务名就是主机名 —— 这三个**必须**覆盖成服务名，
      # 否则会用 app/core/config.py 的 localhost 默认值去连自己容器。
      # 环境变量优先于 .env 文件（pydantic-settings：init > env > dotenv）。
      # 密码**只**在 postgres 服务那一处出现（POSTGRES_PASSWORD）。这里复用
      # 同一组变量而不是再写一遍字面量 —— 两处各写一份，改密码只改一处，
      # 漏改的那处会以「连不上库」的形式在运行时报错。
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pcs}:${POSTGRES_PASSWORD:-pcs_dev}@postgres:5432/${POSTGRES_DB:-pcs}
      LDAP_URL: ldap://openldap:389
    # :ro —— worker 不该改源码。代价是**首次启动要在容器内建 venv**
    # （需要联网装依赖），之后就落在 /opt/venv，不再重装。
    volumes:
      - ./pcs-backend:/app:ro
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      openldap: {condition: service_started}
    # ⚠️ worker 是**唯一**会渲染 PDF 的进程，而 reportlab 要求 TrueType
    # 轮廓：镜像里 `apt install fonts-noto-cjk` **装出 .ttc + CFF 轮廓**，
    # 会报 `TTFError: postscript outlines are not supported`。
    # 真正管用的是宿主机的 pcs-backend/fonts/NotoSansSC-Regular.ttf
    # （由 `uv run python scripts/build_report_font.py` 生成，已 gitignore）——
    # 它是渲染器的**首选候选** `./fonts/...`，靠上面的挂载带进来。
    # ⚠️ 没跑过那个脚本的机器上，本服务照样能启动，**只在渲染 PDF 时才失败**。
    # 起之前先跑：`cd pcs-backend && uv run python scripts/check_report_font.py`
  migrate:
    # 一次性任务：把**测试库**的 schema 升到 head（P10-A · 评审 H-2）。
    #
    # ⚠️ **为什么必须有它**：测试栈连的是 `postgres-pgtest` 的 `pcs_pgtest` 库
    # ⇒ **全仓没有任何东西迁移它**（`scripts/pytest_pg.sh` 只跑 pytest；
    # `tests/alembic/*` 的 PG 用例全走**隔离 schema**）⇒ 全新机器 /
    # `docker compose down -v` 之后那个库是**空 schema** ⇒ `seed` 第一句
    # `SELECT ... FROM workspaces` 就 `relation "workspaces" does not exist`
    # ⇒ README 记的「怎么起测试栈」是**断的**。
    #
    # ⚠️ **绝不**用开发库（`pcs`）的 URL 去迁移它 —— 那是污染。
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["test"]
    working_dir: /app
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uvcache
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pcs}:${POSTGRES_PASSWORD:-pcs_dev}@postgres-pgtest:5432/pcs_pgtest
    volumes:
      - ./pcs-backend:/app:ro
    depends_on:
      postgres-pgtest: {condition: service_healthy}
  seed:
    # 一次性任务：灌 E2E 种子数据（P10-A · Task T2 的脚本）。
    # 与 worker 同款（uv 官方镜像 + 源码挂载 + `uv run --frozen`）——
    # ⚠️ **不要**用裸 `python`：uv 官方镜像里没有项目依赖 ⇒ 立刻 ModuleNotFoundError。
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    # ⚠️ profile 只给**一次性任务** —— 加了它 `docker compose up` 就不再起它
    #    （这是本仓的纪律：日常开发服务绝不进 profile）。
    profiles: ["test"]
    working_dir: /app
    # ⚠️ **两个种子脚本都跑**（P10-B · T7）：
    #   ① `seed_e2e_data.py`  —— P10-A 的项目/用户/物流种子
    #   ② `seed_e2e_flows.py` —— P10-B 的**流程级**种子（物流 · 矩阵 · 交付物 ·
    #      记录 · 设备 · 报表定义 · `alice` 的授权行）
    # ⇒ 真后端通道（`--project=real-backend`）的后端连的是 **public schema**
    # ⇒ ⇒ **两个房间不通**（后端 E2E 车道的数据在隔离 schema 里）
    # ⇒ ⇒ flows 种子**必须也在 public 跑一遍** ⇒ UI 流才有数据可断言。
    # ⇒ ⚠️ 用 `sh -c` 串起来（`&&` ⇒ 第一个失败就不跑第二个 ⇒ fail-closed）。
    command:
      - sh
      - -c
      - >-
        uv run --frozen python scripts/seed_e2e_data.py &&
        uv run --frozen python scripts/seed_e2e_flows.py
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uvcache
      PYTHONDONTWRITEBYTECODE: "1"
      # ⚠️ 连 **pcs_pgtest**（postgres-pgtest 的库名，硬编码）——
      #    连 `pcs_test` 会报 database does not exist；
      #    连开发库 `pcs` 会**污染开发数据**。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pcs}:${POSTGRES_PASSWORD:-pcs_dev}@postgres-pgtest:5432/pcs_pgtest
    volumes:
      - ./pcs-backend:/app:ro
    depends_on:
      # ⚠️ **先迁移再灌种子** —— 否则空 schema 上 `seed` 第一句就炸
      # （`relation "workspaces" does not exist`）。
      postgres-pgtest: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  openldap:
    # 测试用 AD/LDAP 容器。生产环境替换为客户域 LDAP_URL（env 注入）。
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: PCS Test
      LDAP_DOMAIN: test.local
      LDAP_ADMIN_PASSWORD: admin
    ports: ["389:389"]
    volumes:
      - ldap-seed:/container/service/slapd/assets/test
  openldap-seed:
    # 用一次性容器把 seed.ldif 灌入 openldap，完成后退出
    image: osixia/openldap:1.5.0
    depends_on: [openldap]
    command: >
      sh -c "sleep 5 &&
             ldapadd -x -H ldap://openldap:389 -D 'cn=admin,dc=test,dc=local' -w admin
             -f /test/seed.ldif || true"
    volumes:
      - ./infra/ldap:/test:ro
    restart: "no"
volumes:
  pgdata:
  ldap-seed:
  redisdata:
  pgtestdata:
