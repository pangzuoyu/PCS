[project]
name = "pcs-backend"
version = "0.1.0"
description = "PCS 工艺专用综合计算软件 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "arq>=0.25",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "authlib>=1.3",
    "ldap3>=2.9",
    "pyjwt>=2.8",
    "openpyxl>=3.1.5",
    "jinja2>=3.1",
    "chemicals==1.5.2",   # ADR-0030 决策 1/2：pyproject.toml 单一来源 + 精确版本（禁止 >= ~=）
    "fluids==1.3.1",      # ChEDL 三库 P4 闭环版本 (2026-09-13)
    "thermo==0.6.1",
    "CoolProp==6.6.0",    # ADR-0030 V1.2 (P6-0)：P6 PSYCHRO 业务必需 (HAPropsSI)；D3 V1.1 反向决议
    "python-multipart>=0.0.32",
    "xlrd>=2.0",
]

# P6-6A-6 v5.1 — wheel 构建：hatch backend（uv default），include JSON sidecar (B-2 落实)
# Behr 系数 JSON 必须在 wheel 安装后通过 importlib.resources 可访问
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Behr 系数 sidecar JSON（Day-0 Gate 实际拟合系数；P6-6A-6 v5.1）
[tool.hatch.build.targets.wheel.force-include]
"app/services/psychro/data/behr_coefficients.json" = "app/services/psychro/data/behr_coefficients.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "hypothesis>=6.167.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor", ".venv"]
extend-exclude = ["**/fixtures/**", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["UP042", "B008"]  # UP042: str+enum.Enum 是 SA 2.0 习惯；B008: FastAPI Depends() in defaults 是官方推荐

[tool.ruff.lint.extend-per-file-ignores]
# P6-9-PICKUP-5 5A staged scope (user ruling 2026-09-30)
# HYG-P6-6B-1 closure: 本批仅 alembic/versions/ 全量清 D 规则。
# app/ tests/ scripts/ 仍豁免 D —— 采用分批推进（staged adoption），非永久豁免；
# 全局启用 D 会一次性暴露 12263 errors，超出 5A 授权范围（不动 service code / tests）。
# 后续批次逐目录解除豁免，收敛到 D 全局生效。
"app/**" = ["D"]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# P4-TASK0 架构层依赖约束（ADR-0031 残余）。
# 实际校验由 tests/architecture/test_imports.py 用 importlib 自实现（不引入新依赖）。
# 本节作为契约文档；CI 跑 test_imports.py 强制执行。
# 若未来引入 importlinter 包，本节直接作为 importlinter 配置文件即可。
#
# [tool.importlinter:contract:api-downstream]        # TOML key 不允许冒号 → 注释占位
# type = "layers"
# layers = ["app.api", "app.services", "app.models", "app.core"]

# ADR-0030 决策 3：取消 vendoring，依赖 uv/pip 从 PyPI 拉精确版本。
# 历史上 [tool.uv.sources] 指向 vendor/{fluids,chemicals,thermo} editable 路径。
# 2026-09-16 P5-0-6 Task 25 起，三库统一走 PyPI ==X.Y.Z；vendor/ 目录清理由 B-06 在 Task 26 完成后执行。
