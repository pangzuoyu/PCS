[project]
name = "pcs-backend"
version = "0.1.0"
description = "PCS 工艺专用综合计算软件 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "arq>=0.25",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "authlib>=1.3",
    "ldap3>=2.9",
    "pyjwt>=2.8",
    "openpyxl>=3.1.5",
    "jinja2>=3.1",
    "chemicals>=1.5.2",
    "fluids>=1.3.1",
    "thermo>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "hypothesis>=6.167.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "B008"]  # UP042: str+enum.Enum 是 SA 2.0 习惯；B008: FastAPI Depends() in defaults 是官方推荐

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
fluids = { path = "vendor/fluids", editable = true }
chemicals = { path = "vendor/chemicals", editable = true }
thermo = { path = "vendor/thermo", editable = true }
