# F-P3-002 集成: check-api-drift.sh + check_migration_idempotency.sh CI
#
# 触发: push main + pull_request
# 步骤:
#   1. 启动 PostgreSQL (pcs + pcs_test)
#   2. 跑 pcs-backend alembic upgrade head (锁 schema 头)
#   3. 跑 export_openapi.py → 重写 openapi.json
#   4. 跑 check-api-drift.sh → 比较前后端 OpenAPI
#   5. 跑 check_migration_idempotency.sh → 校验 p7_s2_* migrations
#
# CI fail 触发: api drift 或 migration 缺 idempotency guard

name: api-drift-and-migration-guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-drift:
    # 2026-10-08：显式钉住 24.04，不再用 ubuntu-latest。
    # GitHub 公告 ubuntu-latest 将于 2026-10-19 切到 Ubuntu 26 —— 本 workflow
    # 要对真 Postgres 跑 alembic upgrade head 并比对 OpenAPI 快照，runner
    # 无预告换大版本等于让迁移在未验证的 OS 上跑。钉住则变化由我们主动发起。
    # 维护：24.04 退役前改这里，届时跑一次全绿即可。
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pcs
          POSTGRES_PASSWORD: pcs_dev
          POSTGRES_DB: pcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install backend deps
        working-directory: pcs-backend
        run: uv sync

      - name: Run alembic upgrade head (pcs)
        working-directory: pcs-backend
        env:
          DATABASE_URL: postgresql+psycopg://pcs:pcs_dev@localhost:5432/pcs
        run: uv run alembic -c alembic.ini upgrade head

      - name: Export OpenAPI snapshot
        working-directory: pcs-backend
        run: uv run python scripts/export_openapi.py

      - name: Run check-api-drift (semantic)
        working-directory: pcs-frontend
        run: bash scripts/check-api-drift.sh

      - name: Run check-migration-idempotency (p7_s2_*)
        working-directory: pcs-backend
        run: uv run python scripts/check_migration_idempotency.py

      # 2026-10-13 新增（TODO-046）：visual 渲染测试 —— 0.37s、零 Postgres
      # 依赖（内存 SQLite + pdftoppm）。此前 `-m visual` 默认被 pyproject 的
      # addopts 排除（`-m 'not visual'`），CI 从未跑过；CLI 显式 `-m visual`
      # 覆盖 addopts（实测 4 passed）。
      # ⚠️ 缺 poppler 时这些测试**fail 而非 skip**（用户 2026-10-09 裁决）——
      # 所以必须先装，否则本步骤恒红。
      - name: Visual renderer tests (pdftoppm + CJK source font)
        working-directory: pcs-backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          # 报表字体的**源**：Ubuntu 仓库没有任何包提供 NotoSansSC 的可变
          # TTF（fonts-noto-cjk 是 .ttc + CFF 轮廓，reportlab 读不了，见
          # scripts/build_report_font.py 的 docstring）。从 noto-cjk 上游
          # （OFL）拉到派生脚本的默认搜索路径之一。
          sudo mkdir -p /usr/share/fonts/opentype/noto
          sudo curl -fsSL --retry 3 -o /usr/share/fonts/opentype/noto/NotoSansSC-VF.ttf \
            https://github.com/googlefonts/noto-cjk/raw/main/Sans/Variable/TTF/Subset/NotoSansSC-VF.ttf
          # 下载自检：上游若把该路径改成 LFS 指针或 404 HTML，这里立刻
          # 以清晰信息失败，而不是等到 conftest 派生时的长堆栈。
          uv run python - <<'PY'
          from fontTools.ttLib import TTFont
          p = "/usr/share/fonts/opentype/noto/NotoSansSC-VF.ttf"
          f = TTFont(p)
          assert "fvar" in f, f"{p} 不是可变字体（上游布局变了？）"
          print(f"源字体 OK：{p}")
          PY
          # conftest 缺产物时会自动调 build_report_font.py 派生；
          # 派生失败会 pytest.fail（不 skip）。
          uv run pytest -m visual tests/services/report/test_renderer_visual.py

      # 2026-10-07 新增：此前 workflow 完全没有 setup-node —— Node 版本靠
      # runner 自带（"Node.js 20 deprecated" 警告即源于此），且无 npm 缓存，
      # 每次 push 都全量拉包。Vite 5 要求 Node ^18 || >=20，故锁 22。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pcs-frontend/package-lock.json

      - name: Typecheck frontend
        working-directory: pcs-frontend
        run: |
          # npm ci 每次会先删 node_modules，故重试是幂等安全的。
          # 起因：GitHub runner 偶发 ECONNRESET（registry 网络抖动），
          # 一次抖动就让整个 job 判死 —— 实测 2026-10-07 因此红。
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci 连续 3 次失败，判负"
              exit 1
            fi
            echo "::warning::npm ci 第 $attempt 次失败，10s 后重试"
            sleep 10
          done
          npm run typecheck
